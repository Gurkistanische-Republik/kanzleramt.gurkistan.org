<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dekret erfassen | Bundeskanzleramt Gurkistan</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dotgurkistan/archive/refs/heads/main/bilder/Gurkistan-64.png">
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #e8f5e9;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; color: var(--text); background-color: var(--bg-body); padding: 40px 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: var(--bg-card); padding: 32px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0b3d24; }
        .status { margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="form-container" id="main-container">
        <h1>Neues Kanzler-Dekret verfassen</h1>
        <form id="decree-form">
            <div class="form-group">
                <label for="title">Titel des Dekrets</label>
                <input type="text" id="title" required placeholder="z.B. Erlass zur Optimierung...">
            </div>
            <div class="form-group">
                <label for="date">Heutiges Datum (Automatisch gesetzt)</label>
                <input type="text" id="date" required readonly style="background-color: #f1f5f9; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label for="description">Inhalt / Beschreibung des Dekrets</label>
                <textarea id="description" rows="5" required placeholder="Vollständiger Text des Dekrets..."></textarea>
            </div>
            <button type="submit" id="submit-btn">Dekret veröffentlichen & Einzelseite generieren</button>
            <div id="status-message" class="status"></div>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7dAlRCiU4N1zjweZtx9shtP8JVi-3RYw",
        authDomain: "gurkistan-org.firebaseapp.com",
        projectId: "gurkistan-org",
        storageBucket: "gurkistan-org.firebasestorage.app",
        messagingSenderId: "995269998989",
        appId: "1:995269998989:web:c769c6f02af0ed95e6a5c4",
        measurementId: "G-VF0XCNV4R8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Automatisch anonym einloggen beim Laden der Seite
    signInAnonymously(auth)
        .then(() => {
            console.log("Erfolgreich als Admin/Anonym angemeldet.");
        })
        .catch((error) => {
            console.error("Authentifizierungsfehler:", error);
        });

    // Datum setzen
    const todayFormatted = new Date().toLocaleDateString('de-DE', { 
        day: 'numeric', month: 'long', year: 'numeric' 
    });
    document.getElementById("date").value = todayFormatted;

    const form = document.getElementById("decree-form");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const statusMessage = document.getElementById("status-message");
        const submitBtn = document.getElementById("submit-btn");
        
        statusMessage.style.color = "var(--text-muted)";
        statusMessage.textContent = "Übertrage Dekret in das Staatsarchiv...";
        submitBtn.disabled = true;

        try {
            const titleVal = document.getElementById("title").value;
            const dateVal = document.getElementById("date").value;
            const descVal = document.getElementById("description").value;

            const docRef = await addDoc(collection(db, "dekrete"), {
                title: titleVal,
                date: dateVal,
                description: descVal,
                timestamp: new Date()
            });

            const targetUrl = `../dekrete/${docRef.id}`;
            await updateDoc(docRef, { url: targetUrl });

            statusMessage.style.color = "var(--primary)";
            statusMessage.textContent = "Erfolgreich gespeichert! Leite um...";

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1000);

        } catch (error) {
            console.error("Fehler beim Speichern: ", error);
            statusMessage.style.color = "#dc2626";
            statusMessage.textContent = "Fehler: Keine Berechtigung oder Datenbankfehler.";
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
