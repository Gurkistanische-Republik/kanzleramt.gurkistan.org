<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staatsdekret | Das Bundeskanzleramt</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dotgurkistan/archive/refs/heads/main/bilder/Gurkistan-64.png">
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #e8f5e9;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; color: var(--text); background-color: var(--bg-body); padding: 40px 20px; display: flex; justify-content: center; }
        .decree-container { width: 100%; max-width: 700px; background: var(--bg-card); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 12px; font-weight: 800; }
        .meta { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px; font-weight: 500; }
        .badge { font-size: 0.85rem; color: var(--primary); background: var(--primary-light); padding: 4px 10px; border-radius: 6px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 12px; }
        hr { border: none; border-top: 1px solid #e2e8f0; margin-bottom: 24px; }
        .content { font-size: 1.1rem; line-height: 1.7; color: #334155; white-space: pre-wrap; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "GovernmentOrganization",
      "@id": "https://regierung.gurkistan.org/#organization",
      "name": "Regierung von Gurkistan",
      "url": "https://regierung.gurkistan.org",
      "logo": "https://raw.githubusercontent.com/dotgurkistan/archive/refs/heads/main/bilder/Gurkistan-128.png",
      "leader": {
        "@type": "Person",
        "name": "Plankton"
      }
    },
    {
      "@type": "WebPage",
      "name": "Diskrete Archive | Bundeskanzleramt Gurkistan",
      "url": "https://kanzleramt.gurkistan.org/diskrete",
      "about": "Verschluesselte und vertrauliche Unterlagen aus dem Kanzleramt von Gurkistan",
      "publisher": {
        "@id": "https://regierung.gurkistan.org/#organization"
      },
      "isPartOf": {
        "@type": "WebPage",
        "name": "Bundeskanzleramt",
        "url": "https://kanzleramt.gurkistan.org"
      }
    }
  ]
}
</script>
</head>
<body>
    <div class="decree-container" id="decree-view">
        <p>Lade Staatsdekret aus dem Archiv...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7dAlRCiU4N1zjweZtx9shtP8JVi-3RYw",
            authDomain: "gurkistan-org.firebaseapp.com",
            projectId: "gurkistan-org",
            storageBucket: "gurkistan-org.firebasestorage.app",
            messagingSenderId: "995269998989",
            appId: "1:995269998989:web:c769c6f02af0ed95e6a5c4",
            measurementId: "G-VF0XCNV4R8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadDecree() {
            const container = document.getElementById("decree-view");
            
            const urlParams = new URLSearchParams(window.location.search);
            const docId = urlParams.get('id');

            if (!docId) {
                container.innerHTML = `
                    <h1>Fehler</h1>
                    <p class="meta">Es wurde keine gültige Dekret-ID übergeben.</p>
                    <a href="../index.html" class="back-link">← Zurück zum Kanzleramt</a>
                `;
                return;
            }

            try {
                const docRef = doc(db, "dekrete", docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    container.innerHTML = `
                        <a href="../index.html" class="back-link">← Zurück zum Kanzleramt</a>
                        <div><span class="badge">Amtliches Dekret</span></div>
                        <h1>${escapeHtml(data.title)}</h1>
                        <div class="meta">Veröffentlicht am ${escapeHtml(data.date)}</div>
                        <hr>
                        <div class="content">${escapeHtml(data.description)}</div>
                    `;
                } else {
                    container.innerHTML = `
                        <h1 style="color: #dc2626;">Dekret nicht gefunden</h1>
                        <p class="meta">Das angeforderte Staatsdokument existiert nicht oder wurde entfernt.</p>
                        <a href="../index.html" class="back-link">← Zurück zum Kanzleramt</a>
                    `;
                }
            } catch (err) {
                console.error("Fehler beim Laden:", err);
                container.innerHTML = `<p style="color: #dc2626;">Fehler beim Laden des Dokuments aus der Datenbank.</p>`;
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadDecree();
    </script>
</body>
</html>
