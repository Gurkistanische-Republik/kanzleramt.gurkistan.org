<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staatsarchiv | Bundeskanzleramt Gurkistan</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dotgurkistan/archive/refs/heads/main/bilder/Gurkistan-64.png">
    <style>
        :root {
            --primary: #0f5132;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; color: var(--text); background-color: var(--bg-body); padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary); font-size: 2rem; margin-bottom: 8px; font-weight: 800; }
        .subtitle { color: var(--text-muted); margin-bottom: 32px; font-size: 1rem; }
        .card { background: var(--bg-card); padding: 20px 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e2e8f0; margin-bottom: 16px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        .card h2 { font-size: 1.25rem; color: var(--primary); margin-bottom: 6px; }
        .card .date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .card a { display: inline-block; color: white; background: var(--primary); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .card a:hover { background: #0b3d24; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn-write { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>
                <h1>Staatsarchiv</h1>
                <p class="subtitle">Offizielle Dekrete des Bundeskanzleramts Gurkistan</p>
            </div>
            <a href="./schreiben.html" class="btn-write">+ Dekret verfassen</a>
        </div>

        <div id="decree-list">
            <p>Lade Dekrete aus dem Archiv...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7dAlRCiU4N1zjweZtx9shtP8JVi-3RYw",
            authDomain: "gurkistan-org.firebaseapp.com",
            projectId: "gurkistan-org",
            storageBucket: "gurkistan-org.firebasestorage.app",
            messagingSenderId: "995269998989",
            appId: "1:995269998989:web:c769c6f02af0ed95e6a5c4",
            measurementId: "G-VF0XCNV4R8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadDecrees() {
            const listContainer = document.getElementById("decree-list");

            try {
                const q = query(collection(db, "dekrete"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = "<p>Bisher wurden keine Dekrete im Archiv hinterlegt.</p>";
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `
                        <div class="card">
                            <h2>${escapeHtml(data.title)}</h2>
                            <div class="date">Veröffentlicht am ${escapeHtml(data.date)}</div>
                            <a href="./dekrete/index.html?id=${docSnap.id}">Dekret lesen →</a>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;

            } catch (err) {
                console.error("Fehler beim Laden der Liste:", err);
                listContainer.innerHTML = "<p style='color: #dc2626;'>Fehler beim Abrufen der Dekrete aus der Datenbank.</p>";
            }
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadDecrees();
    </script>
</body>
</html>
